server:
  port: 8084
  servlet:
    context-path: /api

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

# A2 authentication (specs/api-endpoints.md "Authentication and Authorisation").
# Secrets come from environment variables and have no defaults: JWT_SECRET (at least 32 bytes,
# same value in every service) and ADMIN_PASSWORD must be set before starting the service.
security:
  jwt:
    secret: ${JWT_SECRET}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL:admin@pcbuilder.local}
    phone: ${ADMIN_PHONE:0000000000}

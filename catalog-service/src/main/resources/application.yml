server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    producer:
      properties:
        # do not block a request for long when the broker is down
        max.block.ms: 1000

# Inventory Service REST call for product stock status (C2)
inventory-service:
  base-url: http://localhost:8082/api
  timeout: 2s

# JWT validation (specs/api-endpoints.md "Authentication and Authorisation").
# JWT_SECRET has no default: it must be set before starting the service, with the same value
# (at least 32 bytes) as in Account Service.
security:
  jwt:
    secret: ${JWT_SECRET}

# Trending products (C3, Architecture Decision 16): the top `size` products by number of views
# in the last `window`.
catalog:
  trending:
    window: ${TRENDING_WINDOW:24h}
    size: ${TRENDING_SIZE:10}

# Kafka messaging (Architecture Decisions 14 and 16). Set KAFKA_ENABLED=false to run without a broker:
# product views are then recorded in-process.
messaging:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
